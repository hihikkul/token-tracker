# Builds "Token Tracker.app" into a DMG and attaches it to a GitHub release.
# Runs when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0) or by hand.
name: macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Icon (.icns)
        run: |
          mkdir -p build/tt.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/token-tracker.png --out build/tt.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/token-tracker.png --out build/tt.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/tt.iconset -o build/token-tracker.icns

      - name: Build app
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --windowed --name "Token Tracker" \
            --icon build/token-tracker.icns \
            --osx-bundle-identifier io.github.hihikkul.tokentracker \
            --add-data "web:web" --add-data "assets:assets" \
            --add-data "prices.json:." --add-data "VERSION:." \
            app.py

      - name: DMG
        run: |
          VER=$(cat VERSION)
          mkdir -p dmg && cp -R "dist/Token Tracker.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Token Tracker" -srcfolder dmg -ov -format UDZO "TokenTracker-${VER}-mac-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: "*.dmg"

  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: dmg-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
          fail_on_unmatched_files: false
          body: |
            macOS: 내 Mac에 맞는 DMG를 받아 Token Tracker를 Applications로 끌어다 놓으세요.
            (Apple Silicon = arm64, Intel = x86_64)
            처음 열 때 "확인되지 않은 개발자" 경고가 뜨면 시스템 설정 → 개인정보 보호 및 보안 → "그래도 열기"를 누르세요.
            Windows: 저장소 ZIP을 받아 install.bat (README 참고).

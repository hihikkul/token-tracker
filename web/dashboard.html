<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토큰 트래커</title>
<meta name="theme-color" content="#f7f7f5">
<style>
/* Design read: personal usage analytics, white ground, Vercel/Linear restraint.
   Dials: VARIANCE 5, MOTION 3, DENSITY 6.
   Rules: one UI accent (cobalt); model colors are a separate
   color-blind-safe set used only in charts, and model #1 always wears the accent.
   Radius scale: cards 12, inner tiles 6, controls full pill. Hairline borders plus a layered shadow. */
:root {
  color-scheme: light;
  --page: #f7f7f5; --card: #ffffff; --card2: #f2f2ef; --line: #ebebe7; --edge: rgba(20, 20, 15, .09);
  --ink: #18181b; --ink2: #4b4b52; --muted: #7a7a82;
  --accent: #1d4ed8; --accent-soft: rgba(29, 78, 216, .08);
    --shadow: 0 1px 2px rgba(24, 24, 27, .05), 0 8px 24px -14px rgba(24, 24, 27, .14);
  --s1: var(--accent); --s2: #6d5bd0; --s3: #0f9473; --s4: #c2508f; --s5: #b39200; --s6: #64748b; --s7: #0b8fb3; --s8: #8f6a4d; --s9: #b4b4ae;
  --c1: #d4693f; --c2: #eba07a; --c3: #a8502e;
  --font: Calibri, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111113; --card: #18181b; --card2: #202024; --line: #2a2a2e; --edge: rgba(255, 255, 255, .08);
  --ink: #f4f4f5; --ink2: #b9b9c0; --muted: #85858d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -12px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--card); padding: 6px 10px; border-radius: 6px; z-index: 20; }
.skip:focus { left: 16px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 16px; }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.brand span { color: var(--muted); font-size: 13.5px; }
.tools { display: flex; gap: 8px; align-items: center; }
.tag { font-size: 12px; color: var(--muted); border: 1px dashed var(--edge); border-radius: 999px; padding: 3px 10px; }
.icon { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--edge); background: var(--card); border-radius: 999px; cursor: pointer; color: var(--ink2); transition: color .15s, background-color .15s; }
.icon:disabled { opacity: .5; cursor: progress; }
.icon:hover { color: var(--ink); background: var(--card2); }
.icon svg { width: 16px; height: 16px; }

/* surfaces */
.card { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; position: relative; }
.card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; letter-spacing: -.005em; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.card h2 small b { color: var(--ink); font-weight: 700; }

/* hero: one lead figure with its own history, two comparison figures stacked beside it */
.hero { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.hero .lead { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 28px; padding: 22px 24px 16px; }
.k { font-size: 14px; color: var(--ink2); }
.v { font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: 8px; }
.lead .v { font-size: clamp(48px, 7vw, 76px); }
.side .v { font-size: clamp(36px, 4.4vw, 46px); }
.v small { font-size: .42em; color: var(--ink2); font-weight: 400; margin-left: 6px; letter-spacing: 0; }
.sub { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
.lead-chart { min-height: 170px; position: relative; }
.lead-chart svg { position: absolute; inset: 0; height: 100%; }
.side { display: grid; gap: 6px; align-content: start; padding: 18px 22px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cmp { display: grid; gap: 5px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.cmp div { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) 4.8rem; align-items: center; gap: 8px; }
.cmp i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
.cmp .prev i { background: var(--muted); opacity: .45; }
.cmp b { color: var(--ink2); font-weight: 400; text-align: right; }

/* control bar */
.bar { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 0; margin-block: -4px; background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.seg { display: inline-flex; border: 1px solid var(--edge); background: var(--card); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink2); min-height: 28px; padding: 0 13px; border-radius: 999px; cursor: pointer; font-size: 13.5px; transition: color .15s, background-color .15s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; min-height: 30px; border: 1px solid var(--edge); background: var(--card2); border-radius: 999px; padding: 0 8px 0 11px; font-size: 13px; cursor: pointer; }
.chip i { width: 9px; height: 9px; border-radius: 2px; }
.chip b { color: var(--muted); font-weight: 400; font-size: 15px; }
.chip:hover b { color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); }

/* grids */
.r2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.r3 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
@media (max-width: 860px) { .r2, .r3, .hero .lead, .mix { grid-template-columns: minmax(0, 1fr); } }
/* the two 30-day figures always share one row, left and right */
@media (max-width: 620px) {
  .hero { gap: 10px; }
  .side { padding: 14px 14px; }
  .side .k { font-size: 13px; }
  .side .v { font-size: clamp(26px, 8vw, 36px); }
  .cmp div { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
  .cmp div > span:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
}

/* charts */
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 4px; margin: -4px 0 8px; }
.legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 12px; color: var(--ink2); transition: opacity .15s, background-color .15s; }
.legend button:hover { background: var(--card2); }
.legend button:focus-visible { outline: 2px solid var(--accent); }
.legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--card2); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 12px 32px -8px rgba(0, 0, 0, .5); z-index: 9; min-width: 180px; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; }
.tip .r span { font-family: var(--mono); font-size: 12px; display: inline-flex; align-items: center; }
.tip .r b { font-weight: 700; }
.tip .r.sum { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px; }

.mix { display: grid; gap: 28px; grid-template-columns: minmax(0, .8fr) minmax(0, 1.3fr) minmax(0, 1.4fr); align-items: start; }
.mix-kpi { display: grid; gap: 12px; }
.mix-kpi .v { font-size: 46px; }
.mini { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 10px; }
.mini b { color: var(--ink); }
.xrow { grid-template-columns: minmax(0, 1fr) 5.2rem 3.2rem 4.8rem; cursor: default; }
.xrow:hover { background: none; }
/* model list (full width: name, bar, numbers) */
.m.mfull { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) 6rem 3.6rem 5.6rem; gap: 16px; }
.mfull .bar2 { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.mhead .bar2 { background: none; }
.mfull .bar2 span { display: block; height: 100%; border-radius: 4px; }
@media (max-width: 720px) { .m.mfull { grid-template-columns: minmax(0, 1fr) 5.2rem 3.2rem 4.8rem; gap: 10px; } .mfull .bar2 { display: none; } }
.share { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-bottom: 14px; }
.share span { display: block; height: 100%; min-width: 2px; }
.mlist { display: grid; }
.m { display: grid; grid-template-columns: minmax(0, 1fr) 5.2rem 3.2rem 4.8rem; gap: 10px; align-items: center; min-height: 34px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background-color .15s, opacity .15s; }
.m:hover { background: var(--card2); }
.m.off { opacity: .4; }
.m.on { background: var(--accent-soft); }
.m .n { display: flex; gap: 8px; align-items: center; min-width: 0; }
.m .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.m .n i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.m .num { text-align: right; white-space: nowrap; }
.m .pct { color: var(--muted); }
.m .na { color: var(--muted); font-size: 12.5px; }
.mhead { font-size: 12px; color: var(--muted); min-height: 24px; cursor: default; }
.mhead:hover { background: none; }

/* treemap */
.tm g { cursor: pointer; }
.tm g:focus-visible { outline: none; }
.tm g:focus-visible rect { stroke: var(--ink); stroke-width: 2; }
.tm text { pointer-events: none; font-family: var(--font); }

@media (max-width: 720px) { .hide-n { display: none; } }

@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .35s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>토큰 트래커</h1><span id="span"></span></div>
    <div class="tools">
      <span class="tag" id="status" aria-live="polite">불러오는 중…</span>
      <button class="icon" id="refreshBtn" type="button" aria-label="로그 다시 읽기">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
      </button>

  <div class="card empty" id="empty-all" hidden>아직 모은 기록이 없어요. Claude Code나 Codex를 한 번 쓰고 나서 오른쪽 위 새로고침을 눌러 주세요.</div>

      <div class="card lead" id="lead-card">
        <div><div class="k">총 사용 토큰</div>
        <div class="v" id="h-total">0</div>
        <div class="sub" id="h-total-s"></div></div>
        <div class="lead-chart" id="lead-chart"></div>
      </div>
      <div class="card side">
        <div class="head"><span class="k">최근 30일 토큰</span></div>
        <div class="v" id="h-30">0</div>
        <div class="cmp" id="c-30"></div>
      </div>
      <div class="card side">
        <div class="head"><span class="k">최근 30일 API 환산 비용</span></div>

<script src="/d3.v7.min.js"></script>
<script>
let DATA = { daily: [], hours: [], prices: {} };
const st = { range: '30', tool: 'all', unit: 'tokens', model: null, project: null, hidden: new Set(), all: false };
try { const t = localStorage.getItem('tt-theme2'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}


// state lives in the URL hash so a filtered view can be bookmarked
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (['7', '30', '90', 'all'].includes(p.get('r'))) st.range = p.get('r');
  if (['tokens', 'cost'].includes(p.get('u'))) st.unit = p.get('u');
  if (['all', 'Claude Code', 'Codex'].includes(p.get('t'))) st.tool = p.get('t');
  st.model = p.get('m'); st.project = p.get('p');
}
function writeHash() {
  const p = new URLSearchParams(); p.set('r', st.range); p.set('u', st.unit); p.set('t', st.tool);
  if (st.model) p.set('m', st.model); if (st.project) p.set('p', st.project);
  try { history.replaceState(null, '', '#' + p.toString()); } catch (e) {}
}
readHash();

// ---------- formatting
const cmp = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 2 });
const grp = new Intl.NumberFormat('en');
const tok = (n) => n >= 1e4 ? cmp.format(n) : grp.format(Math.round(n));
const usd = (n) => n == null ? '-' : n >= 1000 ? '$' + grp.format(Math.round(n)) : n >= 1 ? '$' + n.toFixed(2) : n > 0 ? (n < .01 ? '<$0.01' : '$' + n.toFixed(2)) : '$0';
const val = (n) => st.unit === 'cost' ? usd(n) : tok(n);
const key = () => st.unit === 'cost' ? 'cost_usd' : 'tokens';
const P = (s) => new Date(s + 'T00:00:00');
const iso = d3.timeFormat('%Y-%m-%d');
const md = d3.timeFormat('%-m/%-d');
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const dayName = (d) => DAYS[(d.getDay() + 6) % 7];
const pct = (x) => x >= .995 ? '100%' : x > 0 && x < .01 ? '<1%' : Math.round(x * 100) + '%';
const rangeLabel = () => st.range === 'all' ? '전체 기간' : '최근 ' + st.range + '일';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// color follows the model, never its rank in the current view
let MODELS = [], CLAUDE = [], OTHER = [], LAST = null, FIRST = null;
function prepare() {
  MODELS = d3.rollups(DATA.daily, (v) => d3.sum(v, (r) => r.tokens), (r) => r.model).sort((a, b) => b[1] - a[1]).map((d) => d[0]);
// Claude models wear warm clay tones, every other model takes the cool palette in order of size
  CLAUDE = MODELS.filter((m) => m.startsWith('claude')); OTHER = MODELS.filter((m) => !m.startsWith('claude'));

// ---------- date windows
  // the window always ends today, even on a day with no usage yet
  LAST = d3.max([iso(new Date()), d3.max(DATA.daily, (r) => r.date) || '']);
  FIRST = d3.min(DATA.daily, (r) => r.date) || LAST;
}
const color = (m) => { if (m.startsWith('claude')) { const i = CLAUDE.indexOf(m); return `var(--c${Math.min(3, i + 1)})`; } const i = OTHER.indexOf(m); return `var(--s${i >= 0 && i < 8 ? i + 1 : 9})`; };
const from = (range) => range === 'all' ? FIRST : iso(d3.timeDay.offset(P(LAST), -(Number(range) - 1)));
const prevWindow = (n) => [iso(d3.timeDay.offset(P(LAST), -(2 * n - 1))), iso(d3.timeDay.offset(P(LAST), -n))];
const passTool = (r) => st.tool === 'all' || (r.tool || 'Codex') === st.tool;
const pass = (r) => passTool(r) && (!st.model || r.model === st.model) && (!st.project || r.project === st.project);
const rows = (range = st.range) => DATA.daily.filter((r) => r.date >= from(range) && pass(r));

// ---------- tooltip
function tipIn(card) { let t = card.querySelector(':scope > .tip'); if (!t) { t = el('div', 'tip'); t.hidden = true; t.setAttribute('role', 'status'); card.append(t); } return t; }
function showTip(t, card, ev, title, lines) {
  t.replaceChildren(el('div', 't', title));
  for (const [c, n, v, sum] of lines) {
    const r = el('div', 'r' + (sum ? ' sum' : '')); const a = el('span');
    if (c) { const i = el('i'); i.style.background = c; a.append(i); }
    a.append(n); r.append(a, el('b', '', v)); t.append(r);
  }
  t.hidden = false; const b = card.getBoundingClientRect();
  let x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;

function projects() {

  const R = DATA.daily.filter((r) => r.date >= from(st.range) && passTool(r) && (!st.model || r.model === st.model));
  const by = d3.rollups(R, (v) => ({ t: d3.sum(v, (r) => r.tokens), c: d3.sum(v, (r) => r.cost_usd || 0) }), (r) => r.project).sort((a, b) => b[1].t - a[1].t);
  const top = by.slice(0, 10), rest = by.slice(10);
  if (rest.length) top.push([`나머지 ${rest.length}개`, { t: d3.sum(rest, (d) => d[1].t), c: d3.sum(rest, (d) => d[1].c), other: true }]);
  $('proj-sub').textContent = `${rangeLabel()}, ${by.length}개`;

  const W = box.clientWidth || 500, H = 300;
  const root = d3.treemap().size([W, H]).paddingInner(3).round(true)(d3.hierarchy({ children: top.map(([name, v]) => ({ name, ...v })) }).sum((d) => Math.max(0, st.unit === 'cost' ? d.c : d.t)));
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('class', 'tm');
  const tip = tipIn(card);
  const strength = (i) => Math.max(.18, .95 - i * .09);
  const light = getComputedStyle(document.documentElement).colorScheme === 'light';
  const fg = (d, i, main) => light && (i >= 4 || d.data.other) ? (main ? 'var(--ink)' : 'var(--ink2)') : (main ? '#fff' : 'rgba(255,255,255,.82)');
  const g = svg.selectAll('g').data(root.leaves()).join('g').attr('transform', (d) => `translate(${d.x0},${d.y0})`)
    .attr('tabindex', (d) => d.data.other ? null : 0).attr('role', (d) => d.data.other ? null : 'button').attr('aria-label', (d) => `${d.data.name} ${tok(d.data.t)}`);
  g.append('rect').attr('width', (d) => d.x1 - d.x0).attr('height', (d) => d.y1 - d.y0).attr('rx', 6)
    .attr('fill', (d, i) => d.data.other ? 'var(--s9)' : 'var(--accent)')
    .attr('fill-opacity', (d, i) => (st.project && st.project !== d.data.name ? .12 : 1) * (d.data.other ? .35 : strength(i)));
  const act = (d) => { if (!d.data.other) setFilter('project', st.project === d.data.name ? null : d.data.name); };
  g.on('click', (ev, d) => act(d)).on('keydown', (ev, d) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(d); } })
    .on('mousemove', (ev, d) => showTip(tip, card, ev, d.data.name, [[null, '토큰', tok(d.data.t)], [null, 'API 환산', usd(d.data.c)], [null, '비중', pct(d.value / root.value)]]))
    .on('mouseleave', hideTip(tip));
  const fits = (d, w, h) => d.x1 - d.x0 > w && d.y1 - d.y0 > h;
  const clip = (d) => { const w = d.x1 - d.x0 - 18; const s = d.data.name; return s.length * 7.4 > w ? s.slice(0, Math.max(3, Math.floor(w / 7.4) - 1)) + '…' : s; };
  g.filter((d) => fits(d, 64, 34)).append('text').attr('x', 10).attr('y', 21).attr('style', (d) => `fill: ${fg(d, root.leaves().indexOf(d), true)}; font-weight: 700; font-size: 14px`).text(clip);
  g.filter((d) => fits(d, 64, 52)).append('text').attr('x', 10).attr('y', 39).attr('style', (d) => `fill: ${fg(d, root.leaves().indexOf(d), false)}; font-family: var(--font); font-size: 12.5px`)
    .text((d) => `${st.unit === 'cost' ? usd(d.data.c) : tok(d.data.t)}, ${pct(d.value / root.value)}`);
  box.replaceChildren(svg.node());
}

// ---------- weekday x hour heatmap with an hourly total strip on top
function hours() {
  const box = $('hours'), card = $('hours-card');
  const R = DATA.hours.filter((r) => r.date >= from(st.range) && pass(r));
  $('hours-sub').textContent = `${rangeLabel()}, 진할수록 많이 씀`;
  const grid = d3.rollup(R, (v) => d3.sum(v, (r) => r.tokens), (r) => r.weekday, (r) => r.hour);
  const get = (w, h) => (grid.get(w) && grid.get(w).get(h)) || 0;
  const max = d3.max([...grid.values()].flatMap((m) => [...m.values()])) || 1;
  const hourTot = d3.range(24).map((h) => d3.sum(d3.range(7), (w) => get(w, h)));
  const W = box.clientWidth || 900, ml = 24, cw = (W - ml) / 24, ch = 24, top = 44, H = top + ch * 7 + 22;
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', '요일과 시간대별 사용량');
  const yh = d3.scaleLinear([0, d3.max(hourTot) || 1], [0, top - 12]);
  const tip = tipIn(card);
  svg.append('g').selectAll('rect').data(hourTot).join('rect').attr('x', (v, h) => ml + h * cw + 2).attr('width', cw - 4).attr('y', (v) => top - 8 - yh(v)).attr('height', (v) => Math.max(1, yh(v))).attr('rx', 2).attr('fill', 'var(--muted)').attr('opacity', .5)
    .on('mousemove', (ev, v) => showTip(tip, card, ev, `${hourTot.indexOf(v)}시 전체`, [[null, '토큰', tok(v)]])).on('mouseleave', hideTip(tip));
  DAYS.forEach((d, i) => svg.append('text').attr('x', ml - 8).attr('y', top + i * ch + ch / 2 + 4).attr('text-anchor', 'end').attr('style', 'font-family: var(--font); font-size: 12px').text(d));
  svg.selectAll('rect.c').data(d3.cross(d3.range(7), d3.range(24))).join('rect').attr('class', 'c')
    .attr('x', ([w, h]) => ml + h * cw + 1.5).attr('y', ([w]) => top + w * ch + 1.5).attr('width', cw - 3).attr('height', ch - 3).attr('rx', 4)
    .attr('fill', ([w, h]) => get(w, h) ? 'var(--accent)' : 'var(--line)').attr('fill-opacity', ([w, h]) => get(w, h) ? .12 + .88 * Math.sqrt(get(w, h) / max) : .6)
    .on('mousemove', (ev, [w, h]) => showTip(tip, card, ev, `${DAYS[w]}요일 ${h}시`, [[null, '토큰', tok(get(w, h))]])).on('mouseleave', hideTip(tip));
  d3.range(0, 24, 3).forEach((h) => svg.append('text').attr('x', ml + h * cw + cw / 2).attr('y', H - 4).attr('text-anchor', 'middle').text(h + '시'));
  box.replaceChildren(svg.node());
}


// ---------- input / output / cache mix
const PARTS = [['input', '새 입력', 'var(--s2)'], ['cache_read', '캐시 읽기', 'var(--accent)'], ['cache_write', '캐시 쓰기', 'var(--s5)'], ['output', '출력', 'var(--s3)']];
const priceOf = (m) => (DATA.prices || {})[m];
function mix() {
  const R = rows(), card = $('mix-card');
  const T = Object.fromEntries(PARTS.map(([k]) => [k, d3.sum(R, (r) => r[k] || 0)]));
  const C = Object.fromEntries(PARTS.map(([k]) => [k, d3.sum(R, (r) => { const p = priceOf(r.model); return p ? (r[k] || 0) * (p[k] || 0) / 1e6 : 0; })]));
  const save = d3.sum(R, (r) => { const p = priceOf(r.model); return p ? (r.cache_read || 0) * (p.input - p.cache_read) / 1e6 : 0; });
  const inAll = T.input + T.cache_read + T.cache_write, total = inAll + T.output;
  $('mix-sub').textContent = rangeLabel();
  $('x-hit').textContent = inAll ? (100 * T.cache_read / inAll).toFixed(1) + '%' : '-';
  $('x-save').textContent = usd(save);
  $('x-out').textContent = inAll ? (100 * T.output / inAll).toFixed(2) : '-';
  const basis = st.unit === 'cost' ? C : T, sum = d3.sum(PARTS, ([k]) => basis[k]) || 1;
  $('x-share').replaceChildren(...PARTS.filter(([k]) => basis[k] > 0).map(([k, , c]) => { const s = el('span'); s.style.flex = String(basis[k]); s.style.background = c; return s; }));
  const head = el('div', 'm mhead xrow'); head.append(el('span', '', '항목'), el('span', 'num', '토큰'), el('span', 'num', st.unit === 'cost' ? '비용 비중' : '비중'), el('span', 'num', 'API 환산'));
  $('x-rows').replaceChildren(head, ...PARTS.filter(([k]) => k !== 'cache_write' || T[k] > 0).map(([k, label, c]) => {
    const row = el('div', 'm xrow'); const n = el('div', 'n'); const i = el('i'); i.style.background = c; n.append(i, el('span', '', label)); n.lastChild.style.fontFamily = 'var(--font)'; n.lastChild.style.fontSize = '14px';
    row.append(n, el('span', 'num', tok(T[k])), el('span', 'num pct', pct(basis[k] / sum)), el('span', 'num', usd(C[k])));
    return row;
  }));
  // daily hit rate
  const box = $('x-chart');
  const days = d3.timeDays(P(from(st.range)), d3.timeDay.offset(P(LAST), 1));
  const by = d3.rollup(R, (v) => { const cr = d3.sum(v, (r) => r.cache_read || 0), all = d3.sum(v, (r) => (r.input || 0) + (r.cache_read || 0) + (r.cache_write || 0)); return { hit: all ? cr / all : null, all }; }, (r) => r.date);
  // days with very little input give noisy rates, so they are left out of the line
  const floor = (d3.max([...by.values()], (v) => v.all) || 0) * .01;
  const pts = days.map((d) => { const v = by.get(iso(d)); return { d, all: v ? v.all : 0, hit: v && v.all >= floor ? v.hit : null }; });
  const W = box.clientWidth || 400, H = 180, mb = 22, mt = 8, ml = 38;
  const lo = Math.max(0, Math.floor((d3.min(pts, (p) => p.hit ?? 1) * 10)) / 10 - .1);
  const x = d3.scaleTime([days[0], days[days.length - 1]], [ml, W - 6]), y = d3.scaleLinear([lo, 1], [H - mb, mt]);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', '일별 캐시 적중률');
  const ticks = y.ticks(4);
  svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', ml).attr('x2', W).attr('y1', y).attr('y2', y).attr('stroke', 'var(--line)').attr('stroke-dasharray', '2 4');
  svg.append('g').selectAll('text').data(ticks).join('text').attr('x', ml - 8).attr('y', (t) => y(t) + 4).attr('text-anchor', 'end').text((t) => Math.round(t * 100) + '%');
  if (inAll) { const avg = T.cache_read / inAll; svg.append('line').attr('x1', ml).attr('x2', W).attr('y1', y(avg)).attr('y2', y(avg)).attr('stroke', 'var(--muted)').attr('stroke-dasharray', '4 4'); svg.append('text').attr('x', W - 4).attr('y', y(avg) - 5).attr('text-anchor', 'end').text('평균 ' + (avg * 100).toFixed(1) + '%'); }
  svg.append('path').attr('d', d3.line().defined((p) => p.hit != null).x((p) => x(p.d)).y((p) => y(p.hit))(pts)).attr('fill', 'none').attr('stroke', 'var(--accent)').attr('stroke-width', 2);
  svg.append('g').selectAll('circle').data(pts.filter((p) => p.hit != null)).join('circle').attr('cx', (p) => x(p.d)).attr('cy', (p) => y(p.hit)).attr('r', days.length > 60 ? 0 : 2.5).attr('fill', 'var(--accent)');
  svg.append('g').selectAll('text').data(x.ticks(Math.max(2, Math.floor(W / 90)))).join('text').attr('x', x).attr('y', H - 5).attr('text-anchor', 'middle').text(md);
  const tip = tipIn(card), dot = svg.append('circle').attr('r', 4.5).attr('fill', 'var(--accent)').attr('stroke', 'var(--card)').attr('stroke-width', 2).attr('opacity', 0);
  svg.append('rect').attr('x', ml).attr('width', W - ml).attr('height', H).attr('fill', 'transparent')
    .on('mousemove', (ev) => { const [mx] = d3.pointer(ev); const p = pts[Math.max(0, Math.min(pts.length - 1, Math.round(d3.timeDay.count(days[0], x.invert(mx)))))]; if (p.hit == null) { tip.hidden = true; dot.attr('opacity', 0); return; } dot.attr('cx', x(p.d)).attr('cy', y(p.hit)).attr('opacity', 1); showTip(tip, card, ev, `${md(p.d)} (${dayName(p.d)})`, [[null, '캐시 적중률', (p.hit * 100).toFixed(1) + '%'], [null, '전체 입력', tok(p.all)]]); })
    .on('mouseleave', () => { tip.hidden = true; dot.attr('opacity', 0); });
  box.replaceChildren(svg.node());
}

// ---------- controls
function setFilter(kind, v) { st[kind] = v; render(); }
function chips() {
  const list = [];
  if (st.model) list.push(['model', '모델', st.model, color(st.model)]);
  if (st.project) list.push(['project', '프로젝트', st.project, 'var(--accent)']);
  $('chips').replaceChildren(...list.map(([k, label, v, c]) => {
    const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-label', `${label} 필터 ${v} 지우기`);
    const i = el('i'); i.style.background = c; b.append(i, `${label}: ${v}`, el('b', '', '×')); b.onclick = () => setFilter(k, null); return b;
  }));
  $('hint').hidden = list.length > 0;
}
function segs() { for (const [id, k] of [['range', 'range'], ['tool', 'tool'], ['unit', 'unit']]) document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === st[k]))); }
for (const [id, k] of [['range', 'range'], ['tool', 'tool'], ['unit', 'unit']]) $(id).addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) { st[k] = b.dataset.v; render(); } });
$('themeBtn').onclick = () => {
  const nx = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem('tt-theme2', nx); } catch (e) {}
  if (DATA.daily.length) projects();
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor;
};
addEventListener('hashchange', () => { readHash(); render(); });

function draw() { writeHash(); segs(); chips(); hero(); hours(); daily(); mix(); cumulative(); monthly(); models(); projects(); }
function render() { if (!DATA.daily.length) { showEmpty(); return; } $('main').hidden = false; $('empty-all').hidden = true; draw(); }
function showEmpty() { $('main').hidden = true; $('empty-all').hidden = false; }

// ---------- live data from the local tracker
const tfmt = d3.timeFormat('%-m/%-d %H:%M');
async function load(quiet) {
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    DATA = { daily: d.daily_detail || [], hours: d.hours_detail || [], prices: d.prices || {} };
    prepare(); render();
    const t = d.meta && d.meta.last_scan;
    $('status').textContent = t ? `${tfmt(new Date(t * 1000))} 업데이트` : '업데이트됨';
  } catch (e) {
    if (!quiet) $('status').textContent = '트래커에 연결할 수 없어요';
  }
}
$('refreshBtn').onclick = async () => {
  const b = $('refreshBtn'); b.disabled = true; $('status').textContent = '다시 읽는 중…';
  try { await fetch('/api/refresh', { method: 'POST' }); } catch (e) {}
  await load(); b.disabled = false;
};
load();
setInterval(() => { if (!document.hidden) load(true); }, 60000);
document.querySelectorAll('.card').forEach((c, i) => { c.classList.add('fade'); c.style.animationDelay = Math.min(i, 8) * 30 + 'ms'; });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
</script>
